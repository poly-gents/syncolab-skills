name: Syncolab Knowledge Base
version: 1.1.1
type: instrumental
description:
  capability: Maintain project Knowledge Base concepts and their taxonomy using available kb_* tools.
  trigger_conditions: Use when browsing, creating, or updating project concepts,
    writing formatted bodies, or adding taxonomy types and statuses.
  scope_boundaries: Uses granted kb_* tools in a bound project. Bulk hierarchy imports
    and taxonomy rename/archive belong in Office UI. Excludes external document
    systems and does not bypass approval for destructive changes.
  key_domain_words:
  - knowledge base
  - kb
  - concept
  - taxonomy
  - decision
  - risk
  - managents-knowledge-base
tags:
- managents-knowledge-base
- knowledge-base
- managents-planning
relationships:
  skills:
  - name: curate-docs
    type: references
  - name: managents-workboard
    type: references
  tool_sets:
  - name: managents-knowledge-base
    type: can-have
