name: Managents Knowledge Base
version: 1.0.3
type: instrumental
description:
  capability: Curate project knowledge using Storage TipTap documents (initiative_storage_*).
    Search/browse first; default to coarse HTML nodes that group related material unless the
    user asks to split finely. All kb_* tools are retired for this skill.
  trigger_conditions: Use when searching, browsing, creating, or updating project curated docs
    in Storage; especially when capturing long designs/epics into TipTap without over-splitting.
  scope_boundaries: Project Storage documents only; not SKS Living Docs, CML memory, Office-only
    bulk hierarchy import, or any kb_* Knowledge Base tools.
  key_domain_words:
  - knowledge-base
  - storage
  - tiptap
  - documents
  - classification
tags:
- managents-knowledge-base
- knowledge-base
- syncolab
- tiptap
relationships:
  skills:
  - name: syncolab-living-docs
    type: related-to
  - name: syncolab-cognitive-memory
    type: related-to
  tool_sets:
  - name: initiative-storage
    type: can-have
